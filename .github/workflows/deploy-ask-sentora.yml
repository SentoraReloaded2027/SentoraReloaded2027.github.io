# Deploys the Ask Sentora helper (worker/ask-sentora) to Cloudflare Workers.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown on the Cloudflare dashboard's Workers page
# The Claude key is NOT here: it is set once in Cloudflare as the Worker's secret ANTHROPIC_API_KEY
# (worker/ask-sentora/README.md), and deploys keep it.
name: Deploy Ask Sentora

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker/ask-sentora
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install (exact versions from package-lock.json)
        run: npm ci
      - name: Test against a stand-in Claude API
        run: NODE_USE_ENV_PROXY=1 node test/local-test.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
